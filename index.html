<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mis Lecturas</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  *{font-family:'Inter',sans-serif}
  /* All screens default hidden via CSS — JS shows the right one */
  #auth-screen,#loading-screen,#app{display:none}
  /* Base styles for screens that need flex when shown */
  #auth-screen{min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(135deg,#fefaf6,#fff7ed);padding:2rem}
  #loading-screen{min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#fefaf6}
  #app{min-height:100vh}
  /* Sidebar buttons hidden until Google login */
  #user-info,#btn-sync,#btn-signout{display:none}
  #btn-add-book{display:none}
  /* Tailwind overrides for hidden elements inside components */
  .scrollbar-hide::-webkit-scrollbar{display:none}
  .scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
  .custom-scrollbar::-webkit-scrollbar{width:6px}
  .custom-scrollbar::-webkit-scrollbar-track{background:#fef3e2;border-radius:8px}
  .custom-scrollbar::-webkit-scrollbar-thumb{background:#fb923c;border-radius:8px}
  .animate-spin{animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .animate-pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .fade-in{animation:fadeIn .5s ease forwards}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .zoom-in{animation:zoomIn .3s ease forwards}
  @keyframes zoomIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
  /* hover group helpers */
  .group:hover .group-hover\:opacity-100{opacity:1}
  .group:hover .group-hover\:scale-110{transform:scale(1.1)}
  .group:hover .group-hover\:text-orange-500{color:#f97316}
  .group:hover .group-hover\:bg-orange-500{background:#f97316}
  .group:hover .group-hover\:text-white{color:#fff}
  .group:hover .group-hover\:rotate-6{transform:rotate(6deg)}
  .group:hover .group-hover\:shadow-xl{box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
  .group:hover .group-hover\:-translate-y-1{transform:translateY(-4px)}
  .group:hover .group-hover\:opacity-40{opacity:.4}
  .group:hover .group-hover\:bg-white{background:#fff}
  .group:hover .group-hover\:border-orange-200{border-color:#fed7aa}
  .group:hover .group-hover\:bg-orange-50{background:#fff7ed}
  .group:hover .group-hover\:text-orange-600{color:#ea580c}
  .group:hover .group-hover\:text-black{color:#000}
  input:focus{outline:none;box-shadow:0 0 0 4px #ffedd5}
  .snap-start{scroll-snap-align:start}
  .snap-x{scroll-snap-type:x mandatory}
  /* Tooltip */
  .tooltip-wrap{position:relative;display:inline-block;max-width:100%}
  .tooltip-wrap .tooltip-text{visibility:hidden;opacity:0;background:#1e293b;color:#fff;border-radius:12px;padding:8px 14px;font-size:11px;font-weight:700;position:absolute;z-index:200;bottom:130%;left:50%;transform:translateX(-50%);white-space:nowrap;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:opacity .18s;pointer-events:none}
  .tooltip-wrap .tooltip-text::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1e293b}
  .tooltip-wrap:hover .tooltip-text{visibility:visible;opacity:1}
  /* Year filter */
  .year-pill{transition:all .15s}
  .year-pill.active{background:#f97316!important;color:#fff!important;border-color:#f97316!important}
  /* CRUD Drawer */
  #crud-drawer{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:flex-end}
  #crud-drawer .drawer-overlay{position:absolute;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(8px)}
  #crud-drawer .drawer-panel{position:relative;z-index:1;width:100%;max-width:580px;height:100vh;background:#fff;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.15);display:flex;flex-direction:column}
  .field-locked{background:#f8fafc;cursor:not-allowed;opacity:.7}
  .star-btn{cursor:pointer;transition:transform .15s}
  .star-btn:hover{transform:scale(1.2)}
  .search-result-item{transition:all .15s;cursor:pointer}
  .search-result-item:hover{background:#fff7ed;border-color:#fb923c}
  .author-confirm{animation:slideUp .3s ease forwards}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  /* Ribbon for deceased authors */
  .ribbon-icon{display:inline-block}
</style>
</head>
<body class="bg-[#fefaf6] text-slate-900">

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen">
  <div class="max-w-lg w-full text-center">
    <div class="flex items-center justify-center gap-4 mb-12">
      <div class="bg-orange-500 p-4 rounded-[28px] text-white shadow-2xl shadow-orange-200">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="text-left">
        <h1 class="text-4xl font-black text-slate-800 tracking-tighter">MIS LECTURAS</h1>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Bitácora literaria</p>
      </div>
    </div>
    <div class="bg-white rounded-[48px] p-12 shadow-2xl border border-orange-50 mb-8">
      <button id="btn-google-signin" onclick="signInWithGoogle()"
        class="w-full flex items-center justify-center gap-4 bg-orange-500 hover:bg-orange-600 text-white font-black text-sm uppercase tracking-widest py-5 px-8 rounded-[24px] mb-8 transition-all hover:-translate-y-0.5 shadow-lg shadow-orange-100">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="white" opacity="0.9"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="white" opacity="0.8"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="white" opacity="0.7"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="white" opacity="0.95"/></svg>
        Continuar con Google
      </button>
      <div class="flex items-center gap-4 mb-8">
        <div class="flex-1 h-px bg-slate-100"></div>
        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">o cargá manualmente</span>
        <div class="flex-1 h-px bg-slate-100"></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <label id="btn-books" class="flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer transition-all bg-slate-50 border-slate-100 hover:border-orange-300 hover:bg-orange-50">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-300"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Libros CSV</span>
          <input type="file" accept=".csv" id="file-books" class="hidden"/>
        </label>
        <label id="btn-authors" class="flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer transition-all bg-slate-50 border-slate-100 hover:border-orange-300 hover:bg-orange-50">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-300"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Autores CSV</span>
          <input type="file" accept=".csv" id="file-authors" class="hidden"/>
        </label>
      </div>
    </div>
    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Conexión segura · Tus datos en tu Drive
    </p>
  </div>
</div>

<!-- ===================== LOADING SCREEN ===================== -->
<div id="loading-screen">
  <svg class="animate-spin text-orange-500 mb-8" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  <h2 class="text-2xl font-black tracking-tighter uppercase">Sincronizando con Drive</h2>
  <p id="loading-msg" class="text-slate-400 font-bold mt-3 animate-pulse">Conectando con Google Sheets...</p>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app" class="flex min-h-screen">
  <aside class="w-80 bg-white border-r border-orange-50 p-10 flex flex-col gap-12 sticky top-0 h-screen shadow-[10px_0_30px_rgba(0,0,0,0.02)]">
    <div class="flex items-center gap-4 text-orange-600 font-black text-2xl tracking-tight">
      <div class="bg-orange-500 p-2.5 rounded-2xl text-white shadow-lg shadow-orange-200">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <span>MIS LECTURAS</span>
    </div>
    <nav class="flex flex-col gap-3">
      <button data-tab="home" class="sidebar-link flex items-center gap-5 p-5 rounded-[28px] font-black transition-all bg-orange-500 text-white shadow-2xl shadow-orange-100">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="text-sm tracking-tight">Mi Rincón</span>
      </button>
      <button data-tab="books" class="sidebar-link flex items-center gap-5 p-5 rounded-[28px] font-black transition-all text-slate-400 hover:bg-orange-50 hover:text-orange-600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="text-sm tracking-tight">Biblioteca</span>
      </button>
      <button data-tab="authors" class="sidebar-link flex items-center gap-5 p-5 rounded-[28px] font-black transition-all text-slate-400 hover:bg-orange-50 hover:text-orange-600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="text-sm tracking-tight">Mis Autores</span>
      </button>
    </nav>
    <div class="mt-auto pt-8 border-t border-orange-50 space-y-4">
      <div id="user-info" class="items-center gap-3">
        <img id="user-avatar" src="" referrerpolicy="no-referrer" class="w-9 h-9 rounded-full object-cover border-2 border-orange-100"/>
        <div class="min-w-0">
          <p id="user-name" class="text-xs font-black text-slate-700 truncate"></p>
          <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Google Drive</p>
        </div>
      </div>
      <button id="btn-sync" onclick="syncFromDrive()" class="items-center gap-3 text-slate-300 font-black text-[10px] uppercase tracking-[0.2em] hover:text-orange-500 transition-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Sincronizar Drive
      </button>
      <button id="btn-signout" onclick="signOut()" class="items-center gap-3 text-slate-300 font-black text-[10px] uppercase tracking-[0.2em] hover:text-rose-500 transition-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
      <button id="btn-reload" onclick="location.reload()" style="display:flex" class="items-center gap-3 text-slate-300 font-black text-[10px] uppercase tracking-[0.2em] hover:text-orange-500 transition-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Recargar
      </button>
      <div class="pt-4 border-t border-orange-50">
        <p class="text-[9px] font-bold text-slate-200 tracking-widest">v2025.04.10-r14</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-16 max-w-7xl mx-auto w-full">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-8 mb-16">
      <div>
        <h1 id="page-title" class="text-5xl font-black text-slate-800 tracking-tight mb-2 uppercase">Resumen</h1>
        <p id="page-subtitle" class="text-slate-400 font-black text-[10px] uppercase tracking-[0.3em] flex items-center gap-3">
          <span class="w-12 h-1 bg-orange-200 rounded-full inline-block"></span>
          Tu universo literario en cifras
        </p>
      </div>
      <div id="header-controls" style="display:none" class="items-center gap-4 w-full md:w-auto">
        <div class="flex bg-white p-1.5 rounded-3xl shadow-sm border border-orange-50">
          <button id="btn-grid" onclick="setView('grid')" class="p-3 rounded-2xl transition-all bg-orange-500 text-white shadow-lg">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
          <button id="btn-list" onclick="setView('list')" class="p-3 rounded-2xl transition-all text-slate-300 hover:text-slate-500">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
        <div class="relative flex-1 md:flex-none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" type="text" placeholder="Explorar..." class="pl-16 pr-8 py-4 bg-white rounded-[32px] border border-orange-50 shadow-sm w-full md:w-80 font-bold text-sm text-slate-700" oninput="onSearch()"/>
        </div>
      </div>
    </header>

    <!-- HOME TAB -->
    <div id="tab-home" class="space-y-20 fade-in">
      <div id="stat-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6"></div>
      <div id="fav-sections" class="space-y-20"></div>
      <div id="rank-section" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-8"></div>
      <div id="year-section"></div>
    </div>

    <!-- BOOKS TAB -->
    <div id="tab-books" style="display:none" class="space-y-6 fade-in">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap gap-3 p-2 bg-white border border-orange-50 rounded-[32px] w-fit shadow-sm">
          <button data-filter="todos" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all bg-orange-500 text-white shadow-xl" onclick="setFilter('todos')">Todos <span class="px-2 py-0.5 rounded-lg text-[9px] bg-white/20 text-white" id="count-todos">0</span></button>
          <button data-filter="leido" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all text-slate-400 hover:text-slate-700" onclick="setFilter('leido')">Leídos <span class="px-2 py-0.5 rounded-lg text-[9px] bg-slate-100 text-slate-400" id="count-leido">0</span></button>
          <button data-filter="pendiente" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all text-slate-400 hover:text-slate-700" onclick="setFilter('pendiente')">Pendientes <span class="px-2 py-0.5 rounded-lg text-[9px] bg-slate-100 text-slate-400" id="count-pendiente">0</span></button>
          <button data-filter="wishlist" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all text-slate-400 hover:text-slate-700" onclick="setFilter('wishlist')">Deseados <span class="px-2 py-0.5 rounded-lg text-[9px] bg-slate-100 text-slate-400" id="count-wishlist">0</span></button>

          Agregar libro

      <div id="year-filter-wrap" style="display:none" class="items-center gap-3 flex-wrap bg-white border border-orange-50 rounded-[28px] px-6 py-4 w-fit shadow-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-orange-400"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

      <div id="books-grid"></div>
      <div id="books-pagination" class="flex items-center justify-between mt-8"></div>

    <!-- AUTHORS TAB -->
    <div id="tab-authors" style="display:none" class="fade-in">
      <div id="authors-grid"></div>
      <div id="authors-pagination" class="flex items-center justify-between mt-8"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" style="display:none" class="fixed inset-0 bg-slate-900/80 backdrop-blur-xl z-50 items-center justify-center p-4 md:p-12">
  <div id="modal-content" class="bg-white w-full max-w-6xl rounded-[60px] shadow-2xl overflow-hidden flex flex-col md:flex-row h-[90vh] zoom-in">
    <div id="modal-left" class="w-full md:w-[38%] bg-slate-100 relative h-72 md:h-auto overflow-hidden"></div>
    <div id="modal-right" class="flex-1 p-10 md:p-16 overflow-y-auto bg-white custom-scrollbar"></div>
  </div>
</div>

<!-- CRUD DRAWER -->
<div id="crud-drawer" style="display:none">
  <div class="drawer-overlay" onclick="closeDrawer()"></div>
  <div class="drawer-panel custom-scrollbar">
    <div id="drawer-content"></div>
  </div>
</div>

<!-- STATUS MODAL -->
<div id="status-modal" style="display:none" class="fixed inset-0 bg-slate-900/70 backdrop-blur-xl z-[70] flex items-center justify-center p-6">
  <div id="status-modal-content" class="bg-white rounded-[48px] shadow-2xl p-12 w-full max-w-md zoom-in"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>

// ===== GOOGLE AUTH =====
let _tokenClient = null;
let _tokenExpiry = 0; // timestamp ms when token expires

function signInWithGoogle() {
  const btn = document.getElementById('btn-google-signin');
  btn.innerHTML = `<svg class="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Conectando...`;
  btn.disabled = true;
  const tryInit = () => {
    if (typeof google === 'undefined' || !google.accounts) { setTimeout(tryInit, 200); return; }
    _tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: SCOPES,
      callback: async (tokenResponse) => {
        if (tokenResponse.error) {
          btn.innerHTML = '⚠ Error al conectar. Intentá de nuevo.';
          btn.disabled = false; return;
        }
        googleAccessToken = tokenResponse.access_token;
        // Token lasts 3600s, refresh at 3300s to be safe
        _tokenExpiry = Date.now() + (tokenResponse.expires_in || 3600) * 1000 - 300000;
        dataSource = 'google';
        try {
          const p = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${googleAccessToken}` } });
          const profile = await p.json();
          document.getElementById('user-name').textContent = profile.name || profile.email;
          document.getElementById('user-avatar').src = profile.picture || '';
        } catch(e) {}
        await loadFromGoogleSheets();
      }
    });
    _tokenClient.requestAccessToken({ prompt: '' });
  };
  tryInit();
}

// Call this before any write operation to ensure token is fresh
async function ensureFreshToken() {
  if (!_tokenClient) return; // manual mode
  if (Date.now() < _tokenExpiry) return; // still valid
  // Token expired or about to — request silently (no prompt)
  return new Promise((resolve, reject) => {
    const prev = _tokenClient.callback;
    _tokenClient.callback = (resp) => {
      _tokenClient.callback = prev; // restore
      if (resp.error) { reject(new Error('Token refresh failed: ' + resp.error)); return; }
      googleAccessToken = resp.access_token;
      _tokenExpiry = Date.now() + (resp.expires_in || 3600) * 1000 - 300000;
      resolve();
    };
    _tokenClient.requestAccessToken({ prompt: '' }); // empty prompt = silent refresh
  });
}

async function loadFromGoogleSheets() {
  hide('auth-screen');
  document.getElementById('loading-screen').style.display = 'flex';
  try {
    document.getElementById('loading-msg').textContent = 'Cargando libros desde Google Drive...';
    const booksData = await fetchSheet(SHEET_ID_BOOKS);
    books = processBooks(booksData);
    document.getElementById('loading-msg').textContent = 'Cargando autores desde Google Drive...';
    const authorsData = await fetchSheet(SHEET_ID_AUTHORS);
    authors = processAuthors(authorsData);
    startApp(true);
  } catch(err) {
    console.error('Sheets error:', err);
    hide('loading-screen');
    show('auth-screen', 'flex');
    const btn = document.getElementById('btn-google-signin');
    btn.innerHTML = '⚠ Error al leer las Sheets. Verificá los permisos.';
    btn.disabled = false;
  }
}

async function fetchSheet(sheetId) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:ZZ10000`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
  if (!res.ok) throw new Error(`Sheets API ${res.status}: ${await res.text()}`);
  const json = await res.json();
  const rows = json.values || [];
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => String(h).trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i] !== undefined ? String(row[i]) : ''; });
    return obj;
  });
}

async function syncFromDrive() {
  if (!googleAccessToken) return;
  const btn = document.getElementById('btn-sync');
  const orig = btn.innerHTML;
  btn.innerHTML = `<svg class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Sync...`;
  try {
    const [bd, ad] = await Promise.all([fetchSheet(SHEET_ID_BOOKS), fetchSheet(SHEET_ID_AUTHORS)]);
    books = processBooks(bd); authors = processAuthors(ad);
    renderHome();
    if (activeTab === 'books') renderBooks();
    if (activeTab === 'authors') renderAuthors();
    showToast('✓ Datos actualizados desde Google Drive');
  } catch(e) { showToast('⚠ Error al sincronizar.', true); }
  finally { btn.innerHTML = orig; }
}

  if (!file) return;
  Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => {
    if (type === 'books') {
      books = processBooks(results.data);
      const btn = document.getElementById('btn-books');

      btn.className = 'flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer bg-emerald-50 border-emerald-200';
    } else {
      authors = processAuthors(results.data);
      const btn = document.getElementById('btn-authors');
      btn.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="text-[10px] font-black uppercase tracking-widest text-emerald-600">Autores ✓</span><input type="file" accept=".csv" id="file-authors" class="hidden"/>`;
      btn.className = 'flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer bg-emerald-50 border-emerald-200';
    }
    if (books.length > 0 && authors.length > 0) startApp(false);
  }});
}

// ===== TOAST =====
function showToast(msg, isError = false) {
  const ex = document.getElementById('_toast');
  if (ex) ex.remove();
  const t = document.createElement('div');
  t.id = '_toast';
  t.style.cssText = `position:fixed;bottom:32px;right:32px;z-index:9999;padding:14px 24px;border-radius:20px;font-size:13px;font-weight:900;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.18);background:${isError?'#f43f5e':'#10b981'}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { if(t.parentNode) t.remove(); }, 3500);
}

// ===== DATA PROCESSING =====
function normalizeEstado(raw) {
  const s = (raw || '').toLowerCase().trim();
  if (!s || s === 'null') return 'pendiente';
  if (s === 'deseado' || s === 'wishlist') return 'wishlist';
  if (s === 'leido' || s === 'leído') return 'leido';
  return 'pendiente'; // fallback
}

function processBooks(data) {
  return data.map((b, i) => ({
    ...b,
    libro_id: b.libro_id || `book-${i}`,
    rating: parseInt(b.Mi_Calificacion) || 0,
    favorite: ['sí','si'].includes((b.Es_Favorito||'').toLowerCase()),
    estado: normalizeEstado(b.estado)
  }));
}
function processAuthors(data) {
  return data.map((a, i) => ({
    ...a,
    autor_id: a.autor_id || `auth-${i}`,
    isDead: (a.autor_vivo||'').toLowerCase() === 'no' || !!a.fecha_muerte,
    favorite: ['sí','si'].includes((a.Es_Favorito||'').toLowerCase())
  }));
}
function calculateAge(born, died) {
  if (!born) return null;
  const s = new Date(born), e = died ? new Date(died) : new Date();
  if (isNaN(s.getTime())) return null;
  let age = e.getFullYear() - s.getFullYear();
  const m = e.getMonth() - s.getMonth();
  if (m < 0 || (m === 0 && e.getDate() < s.getDate())) age--;
  return age;
}

// ===== STATS =====
function getStats() {
  const counts = { authors:{}, countries:{}, genres:{}, genders:{'Mujer':0,'Hombre':0,'Otro':0} };
  books.forEach(b => {
    if(b.Autor) counts.authors[b.Autor]=(counts.authors[b.Autor]||0)+1;
    if(b.genero_libro) counts.genres[b.genero_libro]=(counts.genres[b.genero_libro]||0)+1;
  });
  authors.forEach(a => {
    if(a.pais) counts.countries[a.pais]=(counts.countries[a.pais]||0)+1;
    const g=a.genero_autor||'Otro';
    if(counts.genders[g]!==undefined) counts.genders[g]++; else counts.genders['Otro']++;
  });
  const top=(obj,n=5)=>Object.entries(obj).filter(([k])=>k&&k!=='undefined').map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count).slice(0,n);
  return {
    rankedAuthors:top(counts.authors), rankedCountries:top(counts.countries), rankedGenres:top(counts.genres),
    genders:counts.genders,
    totalLeidos:books.filter(b=>b.estado==='leido').length,
    totalPendientes:books.filter(b=>b.estado==='pendiente').length,
    totalWishlist:books.filter(b=>b.estado==='wishlist').length,
    favBooks:books.filter(b=>b.favorite), favAuthors:authors.filter(a=>a.favorite)
  };
}

// ===== PAGINATION HELPER =====
function pageSizeSelector(current, onchange) {
  return `<div class="flex items-center gap-2">
    <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Mostrar:</span>
    ${[24,48,'todos'].map(n=>`<button onclick="${onchange}(${n==='todos'?'null':n})"
      class="px-4 py-2 rounded-[14px] text-[10px] font-black uppercase tracking-widest transition-all ${(n==='todos'&&current===null)||(n===current)?'bg-orange-500 text-white shadow-md':'bg-white border border-orange-100 text-slate-400 hover:border-orange-300'}">
      ${n}
    </button>`).join('')}
  </div>`;
}

function paginationControls(page, totalPages, onPrev, onNext) {
  if (totalPages <= 1) return '';
  return `<div class="flex items-center gap-3">
    <button onclick="${onPrev}()" ${page<=1?'disabled style="opacity:0.3;cursor:not-allowed"':''} class="px-5 py-2.5 rounded-[16px] bg-white border border-orange-100 text-slate-500 font-black text-[11px] hover:border-orange-400 transition-all flex items-center gap-2">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg> Anterior
    </button>
    <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">${page} / ${totalPages}</span>
    <button onclick="${onNext}()" ${page>=totalPages?'disabled style="opacity:0.3;cursor:not-allowed"':''} class="px-5 py-2.5 rounded-[16px] bg-white border border-orange-100 text-slate-500 font-black text-[11px] hover:border-orange-400 transition-all flex items-center gap-2">
      Siguiente <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>`;
}

function setBookPageSize(n) { pageSize = n; bookPage = 1; authorPage = 1; renderBooks(); if(activeTab==='authors') renderAuthors(); }
function bookPrev() { if(bookPage>1){bookPage--;renderBooks();} }
function bookNext() { bookPage++;renderBooks(); }
function authorPrev() { if(authorPage>1){authorPage--;renderAuthors();} }
function authorNext() { authorPage++;renderAuthors(); }

// ===== RENDER BOOKS =====
function getFilteredBooks() {
  const s = searchTerm.toLowerCase();
  return books.filter(b => {
    const ms = (b.titulo||'').toLowerCase().includes(s)||(b.Autor||'').toLowerCase().includes(s);
    const mf = bookFilter==='todos'||b.estado===bookFilter;
    const my = selectedYears.size===0||selectedYears.has(String(b.Anio_lectura||'').trim());
    return ms&&mf&&my;
  });
}

function renderBooks() {
  const s = getStats(); const f = getFilteredBooks();

  document.getElementById('count-pendiente').textContent = s.totalPendientes;
  document.getElementById('count-wishlist').textContent = s.totalWishlist;
  renderYearFilterPills();

  // Pagination
  const total = f.length;
  const paged = pageSize === null ? f : f.slice((bookPage-1)*pageSize, bookPage*pageSize);

  const g = document.getElementById('books-grid');

        <h4 class="font-black text-slate-800 text-xl mb-2 truncate">${b.titulo||''}</h4>

// ===== YEAR FILTER =====
function filterByYear(year) { setTab('books'); setFilter('leido'); selectedYears=new Set([year]); renderYearFilterPills(); renderBooks(); }
function clearYearFilter() { selectedYears.clear(); renderYearFilterPills(); renderBooks(); }
function toggleYearFilter(year) { if(selectedYears.has(year)) selectedYears.delete(year); else selectedYears.add(year); renderYearFilterPills(); renderBooks(); }
function renderYearFilterPills() {
  const wrap = document.getElementById('year-filter-wrap');
  if (bookFilter!=='leido'&&bookFilter!=='todos') { wrap.style.display='none'; return; }
  const years=[...new Set(books.filter(b=>b.estado==='leido'&&b.Anio_lectura).map(b=>String(b.Anio_lectura).trim()).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));
  if (!years.length) { wrap.style.display='none'; return; }
  wrap.style.display='flex';
  document.getElementById('year-filter-pills').innerHTML=years.map(y=>`<button onclick="toggleYearFilter('${y}')" class="year-pill px-4 py-1.5 rounded-full border text-[10px] font-black uppercase tracking-widest ${selectedYears.has(y)?'active':'border-slate-200 text-slate-400 hover:border-orange-300'}">${y}</button>`).join('');
}

async function appendRow(sheetId,values) {
  await ensureFreshToken();
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;

// Find real row number in Sheet - now handled inside updateRowById directly

// Convert 0-based column index to A1 notation (supports AA, AB, etc.)
// Get the first sheet name from a spreadsheet
async function getFirstSheetName(sheetId) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=sheets.properties.title`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
  if (!res.ok) return 'Sheet1';
  const json = await res.json();
  return json.sheets?.[0]?.properties?.title || 'Sheet1';
}

async function updateRowById(sheetId, idFieldName, idValue, values) {
  await ensureFreshToken();

  // Step 1: Get all data to find the row number by ID
  const allUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A:A`;
  const allRes = await fetch(allUrl, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
  if (!allRes.ok) throw new Error(`Error leyendo columna A: ${allRes.status}`);
  const allJson = await allRes.json();
  const allRows = allJson.values || [];

  // Find header row to get ID column index
  const headers = await getSheetHeaders(sheetId);
  const idColIdx = headers.findIndex(h => h === idFieldName);
  if (idColIdx === -1) throw new Error(`Campo "${idFieldName}" no encontrado`);

  // Read the ID column
  const idColUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/R1C${idColIdx+1}:R10000C${idColIdx+1}?majorDimension=COLUMNS`;
  const idColRes = await fetch(idColUrl, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
  if (!idColRes.ok) throw new Error(`Error leyendo columna ID: ${idColRes.status}`);
  const idColJson = await idColRes.json();
  const idColVals = (idColJson.values && idColJson.values[0]) ? idColJson.values[0] : [];

  // Row 0 = header, find our ID starting from index 1
  let sheetRow = -1;
  for (let i = 1; i < idColVals.length; i++) {
    if (idColVals[i] === idValue) { sheetRow = i + 1; break; } // +1 for 1-based, +1 for header
  }
  if (sheetRow === -1) throw new Error(`Libro/Autor con ID "${idValue}" no encontrado en la hoja`);

  // Step 2: Get the sheet name for the range notation
  const sheetName = await getFirstSheetName(sheetId);
  // Use open-ended row range — just specify the row, no end column needed
  // batchUpdate with a named range using R1C1 notation avoids column letter issues
  const batchUrl = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values:batchUpdate`;
  const range = `'${sheetName}'!${sheetRow}:${sheetRow}`; // full row range — safest approach
  const batchBody = {
    valueInputOption: 'USER_ENTERED',
    data: [{ range, values: [values] }]
  };
  const res = await fetch(batchUrl, {
    method: 'POST',
    headers: { Authorization: `Bearer ${googleAccessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(batchBody)
  });
  if (!res.ok) throw new Error(`batchUpdate error ${res.status}: ${await res.text()}`);
  return res.json();
}

async function getSheetHeaders(sheetId) {
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:ZZ1`;
  const res=await fetch(url,{headers:{Authorization:`Bearer ${googleAccessToken}`}});
  const json=await res.json();
  return(json.values&&json.values[0])?json.values[0].map(h=>String(h).trim()):[];
}

async function submitAddBook() {
  const form=document.getElementById('add-book-form');

  form.querySelectorAll('input:not([disabled]),textarea:not([disabled]),select').forEach(el=>{ if(el.name) data[el.name]=el.value; });

  form.querySelectorAll('input[disabled]').forEach(el=>{ if(el.name) data[el.name]=el.value; });
  data.estado=addBookState.estado;
  if(!data.titulo){showToast('⚠ El título es requerido',true);return;}

  if(!addBookState.estado){showToast('⚠ Seleccioná un estado',true);return;}
  data.Mi_Calificacion=addBookState.estado==='leido'?(addBookState.rating||0):'';

  if(addBookState.estado!=='leido'){data.Anio_lectura='';data.Mes_Lectura='';data.Notas='';}
  data.libro_id=getNextId('book');
  showDrawerLoading('Verificando autor...');
  try {
    const authorName=(data.Autor||'').trim().toLowerCase();
    const existing=authors.find(a=>(a.nombre||'').trim().toLowerCase()===authorName);
    if(!existing){
      const authorData=await searchAndConfirmAuthor(data.Autor);
      if(!authorData)return;
      await saveAuthor(authorData);
    }
    showDrawerLoading('Guardando libro en Google Drive...');
    const headers=await getSheetHeaders(SHEET_ID_BOOKS);
    await appendRow(SHEET_ID_BOOKS,buildRowValues(data,headers));
    books.push(processBooks([data])[0]);
    closeDrawer();renderBooks();renderHome();
    showToast(`✓ "${data.titulo}" agregado correctamente`);
  } catch(err){console.error(err);showToast('⚠ Error al guardar.',true);hideDrawerLoading();}
}

async function searchAndConfirmAuthor(authorName) {
  return new Promise(async resolve=>{
    showDrawerLoading(`Buscando "${authorName}" en Open Library...`);
    let olData=null;
    try {
      const res=await fetch(`https://openlibrary.org/search/authors.json?q=${encodeURIComponent(authorName)}&limit=3`);
      const json=await res.json();const docs=json.docs||[];
      if(docs.length>0){
        const a=docs[0];let details={};
        if(a.key){try{const dr=await fetch(`https://openlibrary.org${a.key}.json`);details=await dr.json();}catch(e){}}
        const photoId=a.photos&&a.photos[0]?a.photos[0]:null;
        olData={nombre:a.name||authorName,fecha_nacimiento:a.birth_date||details.birth_date||'',fecha_muerte:a.death_date||details.death_date||'',
          descripcion:typeof details.bio==='string'?details.bio:(details.bio?.value||''),
          foto_url:photoId?`https://covers.openlibrary.org/a/id/${photoId}-L.jpg`:'',
          openlibrary_key:(a.key||'').replace('/authors/',''),autor_vivo:a.death_date?'No':'Sí'};
      }
    } catch(e){}
    hideDrawerLoading();
    renderAuthorConfirm(authorName,olData,resolve);
  });
}

          </select></div>
        <div><label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1.5">Año lectura</label>
          <input type="number" name="Anio_lectura" min="1900" max="2099" value="${new Date().getFullYear()}" class="w-full px-5 py-3 rounded-[18px] border-2 border-orange-100 font-bold text-sm text-slate-700 outline-none focus:border-orange-400"/></div>
      </div>
      <div><label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-2">Calificación</label>
        <div class="flex gap-2" id="exp-star-rating">
          ${[1,2,3,4,5].map(n=>`<button type="button" onclick="setExpRating(${n})" data-star="${n}" class="star-btn text-slate-200 hover:text-amber-400"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>`).join('')}
        </div>
        <input type="hidden" name="Mi_Calificacion" id="exp-rating-value" value="0"/></div>
      <div class="flex items-center gap-4"><label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">¿Favorito?</label>
        <button type="button" id="exp-fav-btn" onclick="toggleExpFav()" class="flex items-center gap-2 px-5 py-2.5 rounded-[16px] border-2 border-slate-100 font-black text-[11px] uppercase tracking-widest transition-all text-slate-400">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> No
        </button>
        <input type="hidden" name="Es_Favorito" id="exp-fav-value" value="No"/></div>
      <div><label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1.5">Notas personales</label>
        <textarea name="Notas" rows="4" placeholder="Tus reflexiones..." class="w-full px-5 py-3 rounded-[18px] border-2 border-orange-100 font-bold text-sm text-slate-700 outline-none focus:border-orange-400 resize-none"></textarea></div>
      <button type="button" onclick="submitReadingExp('${bookId}')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black text-sm uppercase tracking-widest py-5 rounded-[24px] shadow-lg shadow-orange-100 transition-all">Guardar lectura</button>
    </form>
  </div>`);
  _expFav=false; _expRating=0;
}
// ===== EDIT READING EXPERIENCE (for already-read books) =====
function openEditExperience(bookId) {
  const book = books.find(b => b.libro_id === bookId);
  if (!book) return;
  closeModal();
  const monthOpts2=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const curRating = book.rating || 0;
  const curFav = book.favorite || false;
  _expFav = curFav; _expRating = curRating;

  openDrawer(`<div class="p-10 space-y-8">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-orange-500 font-black text-[10px] uppercase tracking-widest mb-1">Editar experiencia</p>
        <h2 class="text-2xl font-black text-slate-800 tracking-tighter leading-tight">${book.titulo||''}</h2>
        <p class="text-orange-400 font-bold text-sm mt-1">${book.Autor||''}</p>
      </div>
      <button onclick="closeDrawer()" class="p-3 rounded-2xl text-slate-300 hover:text-slate-600 transition-all">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="exp-form" class="space-y-6" onsubmit="return false">
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1.5">Mes lectura</label>
          <select name="Mes_Lectura" class="w-full px-5 py-3 rounded-[18px] border-2 border-orange-100 font-bold text-sm text-slate-700 outline-none">
            <option value="">-- Mes --</option>
            ${monthOpts2.map(m=>`<option value="${m}" ${m===book.Mes_Lectura?'selected':''}>${m}</option>`).join('')}
          </select></div>
        <div><label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1.5">Año lectura</label>
          <input type="number" name="Anio_lectura" min="1900" max="2099" value="${book.Anio_lectura||new Date().getFullYear()}"
            class="w-full px-5 py-3 rounded-[18px] border-2 border-orange-100 font-bold text-sm text-slate-700 outline-none focus:border-orange-400"/></div>
      </div>
      <div>
        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-2">Calificación</label>
        <div class="flex gap-2" id="exp-star-rating">
          ${[1,2,3,4,5].map(n=>`<button type="button" onclick="setExpRating(${n})" data-star="${n}" class="star-btn" style="color:${n<=curRating?'#f59e0b':'#e2e8f0'}">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </button>`).join('')}
        </div>
        <input type="hidden" name="Mi_Calificacion" id="exp-rating-value" value="${curRating}"/>
      </div>
      <div class="flex items-center gap-4">
        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest">¿Favorito?</label>
        <button type="button" id="exp-fav-btn" onclick="toggleExpFav()"
          class="flex items-center gap-2 px-5 py-2.5 rounded-[16px] border-2 font-black text-[11px] uppercase tracking-widest transition-all ${curFav?'bg-rose-500 text-white border-rose-500':'border-slate-100 text-slate-400'}">
          ${curFav?`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Sí`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> No`}
        </button>
        <input type="hidden" name="Es_Favorito" id="exp-fav-value" value="${curFav?'Sí':'No'}"/>
      </div>
      <div>
        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest block mb-1.5">Notas personales</label>
        <textarea name="Notas" rows="4" placeholder="Tus reflexiones..."
          class="w-full px-5 py-3 rounded-[18px] border-2 border-orange-100 font-bold text-sm text-slate-700 outline-none focus:border-orange-400 resize-none">${book.Notas||''}</textarea>
      </div>
      <button type="button" onclick="submitReadingExp('${bookId}')"
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black text-sm uppercase tracking-widest py-5 rounded-[24px] shadow-lg shadow-orange-100 transition-all">
        Guardar cambios
      </button>
    </form>
  </div>`);
}

function setExpRating(n) {
  _expRating=n;document.getElementById('exp-rating-value').value=n;
  document.querySelectorAll('#exp-star-rating .star-btn').forEach(btn=>{ btn.style.color=parseInt(btn.dataset.star)<=n?'#f59e0b':'#e2e8f0'; });
}
function toggleExpFav() {
  _expFav=!_expFav;document.getElementById('exp-fav-value').value=_expFav?'Sí':'No';
  const btn=document.getElementById('exp-fav-btn');
  btn.innerHTML=_expFav?`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Sí`:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> No`;
  btn.className=`flex items-center gap-2 px-5 py-2.5 rounded-[16px] border-2 font-black text-[11px] uppercase tracking-widest transition-all ${_expFav?'bg-rose-500 text-white border-rose-500':'border-slate-100 text-slate-400'}`;
}
async function submitReadingExp(bookId) {
  const form=document.getElementById('exp-form');
  const data={};form.querySelectorAll('input,textarea,select').forEach(el=>{if(el.name)data[el.name]=el.value;});
  data.Mi_Calificacion=_expRating||0;data.Es_Favorito=_expFav?'Sí':'No';
  await saveStatusChange(bookId,'leido',data);
}
async function saveStatusChange(bookId,newEstado,extraData) {
  const idx=books.findIndex(b=>b.libro_id===bookId);if(idx===-1)return;
  showDrawerLoading('Guardando en Google Drive...');
  try {
    const headers=await getSheetHeaders(SHEET_ID_BOOKS);
    const updated={...books[idx],estado:newEstado,...extraData};
    const rowValues=buildRowValues(updated,headers);
    await updateRowById(SHEET_ID_BOOKS,'libro_id',bookId,rowValues);
    // Update local state with normalized data
    books[idx]=processBooks([updated])[0];
    closeDrawer();closeStatusModal();closeModal();
    // Re-render all views to reflect changes
    renderHome();
    if(activeTab==='books') renderBooks();
    if(activeTab==='authors') renderAuthors();
    showToast(`✓ Guardado correctamente`);
  } catch(err){console.error(err);showToast('⚠ Error al actualizar: '+err.message,true);hideDrawerLoading();}
}
</script>
</body>
</html>
