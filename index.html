<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Bitácora de Lecturas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
  * { font-family: 'Inter', sans-serif; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: #fef3e2; border-radius: 8px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #fb923c; border-radius: 8px; }
  .animate-spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
  .fade-in { animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .zoom-in { animation: zoomIn 0.3s ease forwards; }
  @keyframes zoomIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
  .group:hover .group-hover\:opacity-100 { opacity:1; }
  .group:hover .group-hover\:scale-110 { transform:scale(1.1); }
  .group:hover .group-hover\:text-orange-500 { color:#f97316; }
  .group:hover .group-hover\:bg-orange-500 { background:#f97316; }
  .group:hover .group-hover\:text-white { color:#fff; }
  .group:hover .group-hover\:rotate-6 { transform:rotate(6deg); }
  .group:hover .group-hover\:shadow-xl { box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1); }
  .group:hover .group-hover\:-translate-y-1 { transform:translateY(-4px); }
  .group:hover .group-hover\:opacity-40 { opacity:.4; }
  .group:hover .group-hover\:bg-white { background:#fff; }
  .group:hover .group-hover\:border-orange-200 { border-color:#fed7aa; }
  .group:hover .group-hover\:bg-orange-50 { background:#fff7ed; }
  .group:hover .group-hover\:text-orange-600 { color:#ea580c; }
  .group:hover .group-hover\:text-black { color:#000; }
  input:focus { outline:none; box-shadow:0 0 0 4px #ffedd5; }
  .snap-start { scroll-snap-align: start; }
  .snap-x { scroll-snap-type: x mandatory; }

  /* ===== TOOLTIP ===== */
  .tooltip-wrap { position: relative; display: inline-block; max-width: 100%; }
  .tooltip-wrap .tooltip-text {
    visibility: hidden; opacity: 0;
    background: #1e293b; color: #fff;
    text-align: left; border-radius: 12px;
    padding: 8px 14px; font-size: 11px; font-weight: 700;
    position: absolute; z-index: 200; bottom: 130%; left: 50%;
    transform: translateX(-50%);
    white-space: nowrap; max-width: 280px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
    transition: opacity 0.18s;
    pointer-events: none;
  }
  .tooltip-wrap .tooltip-text::after {
    content: ''; position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: #1e293b;
  }
  .tooltip-wrap:hover .tooltip-text { visibility: visible; opacity: 1; }

  /* ===== YEAR FILTER PILLS ===== */
  .year-pill { transition: all .15s; }
  .year-pill.active { background: #f97316 !important; color: #fff !important; border-color: #f97316 !important; }

  /* ===== GOOGLE AUTH SCREEN ===== */
  #auth-screen { background: linear-gradient(135deg, #fefaf6 0%, #fff7ed 100%); }
  .google-btn { transition: all 0.2s; box-shadow: 0 4px 20px rgba(249,115,22,0.2); }
  .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(249,115,22,0.35); }
  .sync-badge { animation: syncPulse 2s ease-in-out infinite; }
  @keyframes syncPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(0.97)} }
</style>
</head>
<body class="bg-[#fefaf6] text-slate-900 min-h-screen">

<!-- AUTH / INICIO SCREEN -->
<div id="auth-screen" class="min-h-screen flex items-center justify-center p-8">
  <div class="max-w-lg w-full text-center">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-4 mb-12">
      <div class="bg-orange-500 p-4 rounded-[28px] text-white shadow-2xl shadow-orange-200">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="text-left">
        <h1 class="text-4xl font-black text-slate-800 tracking-tighter">MIS LECTURAS</h1>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">Bitácora literaria</p>
      </div>
    </div>

    <!-- Card principal -->
    <div class="bg-white rounded-[48px] p-12 shadow-2xl border border-orange-50 mb-8">
      <!-- Botón Google -->
      <button id="btn-google-signin" onclick="signInWithGoogle()"
        class="google-btn w-full flex items-center justify-center gap-4 bg-orange-500 hover:bg-orange-600 text-white font-black text-sm uppercase tracking-widest py-5 px-8 rounded-[24px] mb-8">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="white" opacity="0.9"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="white" opacity="0.8"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="white" opacity="0.7"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="white" opacity="0.95"/></svg>
        Continuar con Google
      </button>

      <div class="flex items-center gap-4 mb-8">
        <div class="flex-1 h-px bg-slate-100"></div>
        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">o cargá manualmente</span>
        <div class="flex-1 h-px bg-slate-100"></div>
      </div>

      <!-- Carga manual -->
      <div class="grid grid-cols-2 gap-4">
        <label id="btn-books" class="flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer transition-all bg-slate-50 border-slate-100 hover:border-orange-300 hover:bg-orange-50">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-300"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Libros CSV</span>
          <input type="file" accept=".csv" id="file-books" class="hidden" />
        </label>
        <label id="btn-authors" class="flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer transition-all bg-slate-50 border-slate-100 hover:border-orange-300 hover:bg-orange-50">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-300"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Autores CSV</span>
          <input type="file" accept=".csv" id="file-authors" class="hidden" />
        </label>
      </div>
    </div>

    <!-- Info badge -->
    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Conexión segura · Solo lectura · Tus datos en tu Drive
    </p>
  </div>
</div>

<!-- LOADING SCREEN (durante sync con Google) -->
<div id="loading-screen" class="hidden min-h-screen flex flex-col items-center justify-center bg-[#fefaf6] text-slate-800">
  <svg class="animate-spin text-orange-500 mb-8" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
  </svg>
  <h2 class="text-2xl font-black tracking-tighter uppercase">Sincronizando con Drive</h2>
  <p id="loading-msg" class="text-slate-400 font-bold mt-3 animate-pulse">Conectando con Google Sheets...</p>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-80 bg-white border-r border-orange-50 p-10 flex flex-col gap-12 sticky top-0 h-screen shadow-[10px_0_30px_rgba(0,0,0,0.02)]">
    <div class="flex items-center gap-4 text-orange-600 font-black text-2xl tracking-tight">
      <div class="bg-orange-500 p-2.5 rounded-2xl text-white shadow-lg shadow-orange-200">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <span>MIS LECTURAS</span>
    </div>
    <nav class="flex flex-col gap-3">
      <button data-tab="home" class="sidebar-link flex items-center gap-5 p-5 rounded-[28px] font-black transition-all group bg-orange-500 text-white shadow-2xl shadow-orange-100">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="text-sm tracking-tight">Mi Rincón</span>
      </button>
      <button data-tab="books" class="sidebar-link flex items-center gap-5 p-5 rounded-[28px] font-black transition-all group text-slate-400 hover:bg-orange-50 hover:text-orange-600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="text-sm tracking-tight">Biblioteca</span>
      </button>
      <button data-tab="authors" class="sidebar-link flex items-center gap-5 p-5 rounded-[28px] font-black transition-all group text-slate-400 hover:bg-orange-50 hover:text-orange-600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="text-sm tracking-tight">Mis Autores</span>
      </button>
    </nav>
    <div class="mt-auto pt-8 border-t border-orange-50 space-y-4">
      <!-- User info (shown when logged in via Google) -->
      <div id="user-info" class="hidden items-center gap-3">
        <img id="user-avatar" src="" class="w-9 h-9 rounded-full object-cover border-2 border-orange-100" />
        <div class="min-w-0">
          <p id="user-name" class="text-xs font-black text-slate-700 truncate"></p>
          <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Google Drive</p>
        </div>
      </div>
      <button id="btn-sync" onclick="syncFromDrive()" class="hidden items-center gap-3 text-slate-300 font-black text-[10px] uppercase tracking-[0.2em] hover:text-orange-500 transition-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Sincronizar Drive
      </button>
      <button onclick="signOut()" id="btn-signout" class="hidden items-center gap-3 text-slate-300 font-black text-[10px] uppercase tracking-[0.2em] hover:text-rose-500 transition-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
      <!-- Fallback for manual mode -->
      <button onclick="location.reload()" id="btn-reload" class="flex items-center gap-3 text-slate-300 font-black text-[10px] uppercase tracking-[0.2em] hover:text-orange-500 transition-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Recargar
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-16 max-w-7xl mx-auto w-full">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-8 mb-16">
      <div>
        <h1 id="page-title" class="text-5xl font-black text-slate-800 tracking-tight mb-2 uppercase">Resumen</h1>
        <p id="page-subtitle" class="text-slate-400 font-black text-[10px] uppercase tracking-[0.3em] flex items-center gap-3">
          <span class="w-12 h-1 bg-orange-200 rounded-full inline-block"></span>
          Tu universo literario en cifras
        </p>
      </div>
      <div id="header-controls" class="hidden items-center gap-4 w-full md:w-auto flex">
        <div class="flex bg-white p-1.5 rounded-3xl shadow-sm border border-orange-50">
          <button id="btn-grid" onclick="setView('grid')" class="p-3 rounded-2xl transition-all bg-orange-500 text-white shadow-lg">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
          <button id="btn-list" onclick="setView('list')" class="p-3 rounded-2xl transition-all text-slate-300 hover:text-slate-500">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
        <div class="relative flex-1 md:flex-none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" type="text" placeholder="Explorar..." class="pl-16 pr-8 py-4 bg-white rounded-[32px] border border-orange-50 shadow-sm w-full md:w-80 font-bold text-sm text-slate-700" oninput="onSearch()" />
        </div>
      </div>
    </header>

    <!-- HOME TAB -->
    <div id="tab-home" class="space-y-20 fade-in">
      <div id="stat-cards" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6"></div>
      <div id="fav-sections" class="space-y-20"></div>
      <div id="rank-section" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-8"></div>
      <div id="year-section"></div>
    </div>

    <!-- BOOKS TAB -->
    <div id="tab-books" class="hidden space-y-6 fade-in">
      <div class="flex flex-wrap gap-3 p-2 bg-white border border-orange-50 rounded-[32px] w-fit shadow-sm">
        <button data-filter="todos" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all bg-orange-500 text-white shadow-xl" onclick="setFilter('todos')">Todos <span class="px-2 py-0.5 rounded-lg text-[9px] bg-white/20 text-white" id="count-todos">0</span></button>
        <button data-filter="leido" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all text-slate-400 hover:text-slate-700" onclick="setFilter('leido')">Leídos <span class="px-2 py-0.5 rounded-lg text-[9px] bg-slate-100 text-slate-400" id="count-leido">0</span></button>
        <button data-filter="pendiente" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all text-slate-400 hover:text-slate-700" onclick="setFilter('pendiente')">Pendientes <span class="px-2 py-0.5 rounded-lg text-[9px] bg-slate-100 text-slate-400" id="count-pendiente">0</span></button>
        <button data-filter="wishlist" class="pill-filter px-8 py-3 rounded-[24px] text-[10px] font-black uppercase tracking-widest flex items-center gap-3 transition-all text-slate-400 hover:text-slate-700" onclick="setFilter('wishlist')">Deseados <span class="px-2 py-0.5 rounded-lg text-[9px] bg-slate-100 text-slate-400" id="count-wishlist">0</span></button>
      </div>
      <!-- Year multi-select filter -->
      <div id="year-filter-wrap" class="hidden items-center gap-3 flex-wrap bg-white border border-orange-50 rounded-[28px] px-6 py-4 w-fit shadow-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-orange-400"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Año lectura:</span>
        <div id="year-filter-pills" class="flex flex-wrap gap-2"></div>
        <button onclick="clearYearFilter()" class="text-[10px] font-black text-orange-400 hover:text-orange-600 uppercase tracking-widest transition-colors ml-1">✕ Limpiar</button>
      </div>
      <div id="books-grid"></div>
    </div>

    <!-- AUTHORS TAB -->
    <div id="tab-authors" class="hidden fade-in">
      <div id="authors-grid"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-xl z-50 flex items-center justify-center p-4 md:p-12">
  <div id="modal-content" class="bg-white w-full max-w-6xl rounded-[60px] shadow-2xl overflow-hidden flex flex-col md:flex-row h-[90vh] zoom-in">
    <div id="modal-left" class="w-full md:w-[38%] bg-slate-100 relative h-72 md:h-auto overflow-hidden"></div>
    <div id="modal-right" class="flex-1 p-10 md:p-16 overflow-y-auto bg-white custom-scrollbar"></div>
  </div>
</div>

<script>
// ===== STATE =====
let books = [], authors = [], activeTab = 'home', viewMode = 'grid', searchTerm = '', bookFilter = 'todos';
let selectedItem = null, modalType = null;
let selectedYears = new Set();

const FILE_BOOKS = 'libros_enriquecidos_full.csv';
const FILE_AUTHORS = 'autores_enriquecidos.csv';

// ===== SVG ICONS =====
const icons = {
  bookOpen: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
  bookmark: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  star: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,

// ===== DATA PROCESSING =====
function processBooks(data) {
  return data.map((b, i) => ({
    ...b,
    libro_id: b.libro_id || `book-${i}`,
    rating: parseInt(b.Mi_Calificacion) || 0,
    favorite: b.Es_Favorito?.toLowerCase() === 'sí' || b.Es_Favorito?.toLowerCase() === 'si',
    estado: b.estado || (b.Anio_lectura ? 'leido' : b.Anio_lectura === "" && b.Mi_Calificacion === "" ? 'wishlist' : 'pendiente')
  }));
}

function processAuthors(data) {
  return data.map((a, i) => ({
    ...a,
    autor_id: a.autor_id || `auth-${i}`,
    isDead: a.autor_vivo?.toLowerCase() === 'no' || !!a.fecha_muerte,
    favorite: a.Es_Favorito?.toLowerCase() === 'sí' || a.Es_Favorito?.toLowerCase() === 'si'
  }));
}

function calculateAge(born, died) {
  if (!born) return null;
  const start = new Date(born);
  const end = (died && died !== "") ? new Date(died) : new Date();
  if (isNaN(start.getTime())) return null;
  let age = end.getFullYear() - start.getFullYear();
  const m = end.getMonth() - start.getMonth();
  if (m < 0 || (m === 0 && end.getDate() < start.getDate())) age--;
  return age;
}

// ===== STATS =====
function getStats() {
  const counts = { authors: {}, countries: {}, genres: {}, genders: { 'Mujer': 0, 'Hombre': 0, 'Otro': 0 } };
  books.forEach(b => {
    if (b.Autor) counts.authors[b.Autor] = (counts.authors[b.Autor] || 0) + 1;
    if (b.genero_libro) counts.genres[b.genero_libro] = (counts.genres[b.genero_libro] || 0) + 1;
  });
  authors.forEach(a => {
    if (a.pais) counts.countries[a.pais] = (counts.countries[a.pais] || 0) + 1;
    const g = a.genero_autor || 'Otro';
    if (counts.genders[g] !== undefined) counts.genders[g]++; else counts.genders['Otro']++;
  });
  const top = (obj, n=5) => Object.entries(obj).filter(([name]) => name && name !== 'undefined').map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count).slice(0, n);
  return {
    rankedAuthors: top(counts.authors),
    rankedCountries: top(counts.countries),
    rankedGenres: top(counts.genres),
    genders: counts.genders,
    totalLeidos: books.filter(b => b.estado === 'leido').length,
    totalPendientes: books.filter(b => b.estado === 'pendiente').length,
    totalWishlist: books.filter(b => b.estado === 'wishlist').length,
    favBooks: books.filter(b => b.favorite),
    favAuthors: authors.filter(a => a.favorite)
  };
}

function modernInfoBoxTooltip(label, value, icon) {
  const display = value || '---';
  const isLong = display.length > 16;
  const inner = isLong
    ? `<div class="tooltip-wrap cursor-help"><p class="text-sm font-black text-slate-700 truncate" style="max-width:110px">${display}</p><span class="tooltip-text">${display}</span></div>`
    : `<p class="text-sm font-black text-slate-700 truncate">${display}</p>`;
  return `<div class="flex items-center gap-4 bg-white p-5 rounded-[28px] border border-orange-50 shadow-sm group hover:border-orange-200 transition-colors">
    <div class="p-3 bg-orange-50 rounded-2xl text-orange-400 group-hover:bg-orange-500 group-hover:text-white transition-all flex-shrink-0">${icon}</div>
    <div class="min-w-0 flex-1">

// ===== BOOKS PER YEAR CHART =====
function renderYearChart() {
  const yearCounts = {};
  books.filter(b => b.estado === 'leido' && b.Anio_lectura).forEach(b => {
    const y = String(b.Anio_lectura).trim();
    if (y) yearCounts[y] = (yearCounts[y] || 0) + 1;
  });
  const entries = Object.entries(yearCounts).sort(([a],[b]) => Number(a) - Number(b));
  if (entries.length === 0) { document.getElementById('year-section').innerHTML = ''; return; }
  const maxVal = Math.max(...entries.map(([,v]) => v));

  document.getElementById('year-section').innerHTML = `

          return `
            <div class="flex flex-col items-center gap-2 flex-shrink-0 group cursor-pointer" onclick="filterByYear('${year}')">
              <span class="text-[11px] font-black text-orange-500 opacity-0 group-hover:opacity-100 transition-opacity">${count}</span>

}

// ===== YEAR FILTER =====
function filterByYear(year) {
  setTab('books');
  setFilter('leido');
  selectedYears = new Set([year]);
  renderYearFilterPills();
  renderBooks();
}

function clearYearFilter() {
  selectedYears.clear();
  renderYearFilterPills();
  renderBooks();
}

function toggleYearFilter(year) {
  if (selectedYears.has(year)) selectedYears.delete(year);
  else selectedYears.add(year);
  renderYearFilterPills();
  renderBooks();
}

function renderYearFilterPills() {
  const wrap = document.getElementById('year-filter-wrap');
  const pills = document.getElementById('year-filter-pills');

  // Only show for leido or todos
  if (bookFilter !== 'leido' && bookFilter !== 'todos') {
    wrap.classList.add('hidden'); wrap.classList.remove('flex');
    return;
  }
  const leidos = books.filter(b => b.estado === 'leido' && b.Anio_lectura);
  const years = [...new Set(leidos.map(b => String(b.Anio_lectura).trim()).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
  if (years.length === 0) { wrap.classList.add('hidden'); wrap.classList.remove('flex'); return; }

  wrap.classList.remove('hidden'); wrap.classList.add('flex');
  pills.innerHTML = years.map(y => `
    <button onclick="toggleYearFilter('${y}')"
      class="year-pill px-4 py-1.5 rounded-full border text-[10px] font-black uppercase tracking-widest ${selectedYears.has(y) ? 'active' : 'border-slate-200 text-slate-400 hover:border-orange-300 hover:text-orange-500 bg-white'}">
      ${y}
    </button>`).join('');
}

// ===== RENDER BOOKS =====
function getFilteredBooks() {
  const s = searchTerm.toLowerCase();
  return books.filter(b => {
    const matchSearch = (b.titulo||'').toLowerCase().includes(s) || (b.Autor||'').toLowerCase().includes(s);
    const matchFilter = bookFilter === 'todos' || b.estado === bookFilter;
    const matchYear = selectedYears.size === 0 || selectedYears.has(String(b.Anio_lectura||'').trim());
    return matchSearch && matchFilter && matchYear;
  });
}

// ===== GOOGLE SIGN IN =====
function signInWithGoogle() {
  const btn = document.getElementById('btn-google-signin');
  btn.innerHTML = `<svg class="animate-spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Conectando...`;
  btn.disabled = true;

  // Wait for GSI library to be ready
  const tryInit = () => {
    if (typeof google === 'undefined' || !google.accounts) {
      setTimeout(tryInit, 200); return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: SCOPES,
      callback: async (tokenResponse) => {
        if (tokenResponse.error) {
          btn.innerHTML = '⚠ Error al conectar. Intentá de nuevo.';
          btn.disabled = false;
          return;
        }
        googleAccessToken = tokenResponse.access_token;
        dataSource = 'google';
        // Get user profile
        try {
          const profileRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
            headers: { Authorization: `Bearer ${googleAccessToken}` }
          });
          const profile = await profileRes.json();
          document.getElementById('user-name').textContent = profile.name || profile.email;
          document.getElementById('user-avatar').src = profile.picture || '';
        } catch(e) { /* silent */ }
        await loadFromGoogleSheets();
      }
    });
    client.requestAccessToken();
  };
  tryInit();
}

// ===== LOAD FROM GOOGLE SHEETS =====
async function loadFromGoogleSheets() {
  document.getElementById('auth-screen').classList.add('hidden');
  const ls = document.getElementById('loading-screen');
  ls.classList.remove('hidden');
  ls.style.display = 'flex';
  ls.style.flexDirection = 'column';

  try {
    document.getElementById('loading-msg').textContent = 'Cargando libros desde Google Drive...';
    const booksData = await fetchSheet(SHEET_ID_BOOKS);
    books = processBooks(booksData);

    document.getElementById('loading-msg').textContent = 'Cargando autores desde Google Drive...';
    const authorsData = await fetchSheet(SHEET_ID_AUTHORS);
    authors = processAuthors(authorsData);

    startApp(true);
  } catch(err) {
    console.error('Sheets error:', err);
    ls.style.display = 'none';
    ls.classList.add('hidden');
    document.getElementById('auth-screen').classList.remove('hidden');
    const btn = document.getElementById('btn-google-signin');
    btn.innerHTML = '⚠ Error al leer las Sheets. Verificá los permisos.';
    btn.disabled = false;
  }
}

async function fetchSheet(sheetId) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A1:ZZ10000`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${googleAccessToken}` } });
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`Sheets API ${res.status}: ${text}`);
  }
  const json = await res.json();
  const rows = json.values || [];
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => String(h).trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i] !== undefined ? String(row[i]) : ''; });
    return obj;
  });
}

// ===== SYNC =====
async function syncFromDrive() {
  if (!googleAccessToken) return;
  const btn = document.getElementById('btn-sync');
  const origHtml = btn.innerHTML;
  btn.innerHTML = `<svg class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Sincronizando...`;
  try {
    const [booksData, authorsData] = await Promise.all([
      fetchSheet(SHEET_ID_BOOKS),
      fetchSheet(SHEET_ID_AUTHORS)
    ]);
    books = processBooks(booksData);
    authors = processAuthors(authorsData);
    renderHome();
    if (activeTab === 'books') renderBooks();
    if (activeTab === 'authors') renderAuthors();
    showToast('✓ Datos actualizados desde Google Drive');
  } catch(err) {
    showToast('⚠ Error al sincronizar. Revisá tu conexión.', true);
  } finally {
    btn.innerHTML = origHtml;
  }
}

// ===== TOAST =====
function showToast(msg, isError = false) {
  const existing = document.getElementById('toast-msg');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'toast-msg';
  toast.style.cssText = `position:fixed;bottom:32px;right:32px;z-index:9999;padding:14px 24px;border-radius:20px;font-size:13px;font-weight:900;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.18);transition:all .3s;background:${isError?'#f43f5e':'#10b981'}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { if(toast.parentNode) toast.remove(); }, 3500);
}

// ===== START APP =====
function startApp(fromGoogle = false) {
  document.getElementById('auth-screen').classList.add('hidden');
  const ls = document.getElementById('loading-screen');
  ls.classList.add('hidden');
  ls.style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('app').classList.add('flex');

  if (fromGoogle) {
    document.getElementById('user-info').classList.remove('hidden');
    document.getElementById('user-info').classList.add('flex');
    document.getElementById('btn-sync').classList.remove('hidden');
    document.getElementById('btn-sync').classList.add('flex');
    document.getElementById('btn-signout').classList.remove('hidden');
    document.getElementById('btn-signout').classList.add('flex');
    document.getElementById('btn-reload').classList.add('hidden');
    showToast('✓ Conectado a Google Drive');
  }
  renderHome();
}

// ===== MANUAL FILE UPLOAD =====
function handleFileUpload(e, type) {
  const file = e.target.files[0];
  if (!file) return;
  Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => {
    if (type === 'books') {
      books = processBooks(results.data);
      const btn = document.getElementById('btn-books');
      btn.innerHTML = `${icons.checkCircle}<span class="text-[10px] font-black uppercase tracking-widest text-emerald-600">Libros ✓</span><input type="file" accept=".csv" id="file-books" class="hidden"/>`;
      btn.className = 'flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer transition-all bg-emerald-50 border-emerald-200';
    } else {
      authors = processAuthors(results.data);
      const btn = document.getElementById('btn-authors');
      btn.innerHTML = `${icons.checkCircle}<span class="text-[10px] font-black uppercase tracking-widest text-emerald-600">Autores ✓</span><input type="file" accept=".csv" id="file-authors" class="hidden"/>`;
      btn.className = 'flex flex-col items-center gap-3 p-6 rounded-[32px] border-2 border-dashed cursor-pointer transition-all bg-emerald-50 border-emerald-200';
    }
    if (books.length > 0 && authors.length > 0) startApp(false);
  }});
}
